<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0f17">
  <title>Apex TS — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise"></div>

  <main class="page">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <strong>APEX TS</strong>
          <span>TEAM SPEAK SERVER</span>
        </div>
      </div>
      <div class="status"><i></i> ONLINE SOON</div>
    </header>

    <section class="hero">
      <div class="ornament ornament-right">𐎠 𐎱 𐎧 𐎿</div>
      <div class="ornament ornament-left">𐎠 𐎱 𐎧 𐎿</div>

      <div class="winged-disc" aria-hidden="true">
        <span class="wing"></span>
        <span class="disk">✦</span>
        <span class="wing reverse"></span>
      </div>

      <p class="eyebrow">𐎠𐎱𐎧𐎿 · A NEW ERA BEGINS</p>
      <h1>APEX <span>TS</span></h1>
      <div class="line"></div>
      <h2>COMING SOON</h2>
      <p class="subtitle">
        سرور تیم‌اسپیک <b>Apex TS</b> در حال آماده‌سازی است.
        <br>دروازه‌های سرور به‌زودی باز می‌شوند.
      </p>

      <section class="countdown" aria-label="Countdown">
        <div class="time-box">
          <span id="hours">12</span><small>ساعت</small>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <span id="minutes">00</span><small>دقیقه</small>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <span id="seconds">00</span><small>ثانیه</small>
        </div>
      </section>

      <p id="message" class="message">تا گشایش Apex TS</p>

      <div class="divider">
        <span>𐎠</span><span></span><span>𐎠</span>
      </div>

      <p class="footer-text">THE LEGACY • THE COMMUNITY • THE APEX</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
